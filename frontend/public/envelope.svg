<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="36" height="36" rx="9" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Logo Mark: Stylized Ascending "R" & Supersonic Inbox Wing -->
  <g filter="url(#glow)">
    <!-- Back wing / Inbox Fold -->
    <path d="M9 13.5C9 11.567 10.567 10 12.5 10H23.5C25.433 10 27 11.567 27 13.5V22.5C27 24.433 25.433 26 23.5 26H12.5C10.567 26 9 24.433 9 22.5V13.5Z" fill="#1E40AF" fill-opacity="0.4"/>
    
    <!-- Paper Plane / Envelope Dynamic Chevron (Outbound Reach) -->
    <path d="M9.5 12L18 18.5L26.5 12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Outbound dynamic arrow/paper dart slice -->
    <path d="M12 24.5L18 19.5L24 24.5" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic fast-send beacon point -->
    <circle cx="18" cy="18.5" r="1.75" fill="#FFFFFF"/>
  </g>
</svg>
